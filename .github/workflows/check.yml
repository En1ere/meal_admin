name: Admin checks
on: [push, pull_request]
permissions:
    contents: read
jobs:
    check:
        runs-on: ubuntu-latest
        env:
            QA_OUTPUT_DIR: ${{ runner.temp }}/meal-admin-check
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run build
            - run: npm run test:e2e:admin -- --list
