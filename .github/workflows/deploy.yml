name: Admin image and deploy

on:
    workflow_run:
        workflows: [Admin checks]
        types: [completed]

permissions:
    contents: read

concurrency:
    group: meal-admin-production
    cancel-in-progress: false

jobs:
    quality-gate:
        if: >-
            github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main'
        runs-on: ubuntu-latest
        outputs:
            source-sha: ${{ steps.metadata.outputs.source-sha }}
            version: ${{ steps.metadata.outputs.version }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ github.event.workflow_run.head_sha }}
                  persist-credentials: false
            - id: metadata
              shell: bash
              run: |
                  set -euo pipefail
                  version="$(node -p "require('./package.json').version")"
                  test -n "$version"
                  echo "source-sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
                  echo "version=$version" >> "$GITHUB_OUTPUT"

    image:
        needs: quality-gate
        runs-on: ubuntu-latest
        permissions:
            attestations: write
            contents: read
            id-token: write
            packages: write
        outputs:
            image: ${{ steps.image.outputs.image }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  ref: ${{ needs.quality-gate.outputs.source-sha }}
                  persist-credentials: false
            - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
            - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - name: Refuse a stale main build
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_SHA: ${{ needs.quality-gate.outputs.source-sha }}
              run: |
                  set -euo pipefail
                  current_sha="$(curl --fail --silent --show-error \
                      --header "Authorization: Bearer $GITHUB_TOKEN" \
                      --header "Accept: application/vnd.github+json" \
                      --header "X-GitHub-Api-Version: 2022-11-28" \
                      "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
                  test "$current_sha" = "$SOURCE_SHA" || {
                      echo "Refusing stale main build: expected $SOURCE_SHA, current $current_sha" >&2
                      exit 75
                  }
            - id: build
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  push: true
                  build-args: VITE_APP_VERSION=${{ needs.quality-gate.outputs.version }}
                  tags: ghcr.io/en1ere/meal_admin:sha-${{ needs.quality-gate.outputs.source-sha }}
                  provenance: mode=max
                  sbom: true
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            - id: image
              shell: bash
              run: echo "image=ghcr.io/en1ere/meal_admin@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

    deploy:
        needs: [quality-gate, image]
        runs-on: ubuntu-latest
        environment:
            name: test
            url: https://admin.abstract-usable-gazebo.ruweb.place
        permissions:
            contents: read
        env:
            ADMIN_IMAGE: ${{ needs.image.outputs.image }}
            SOURCE_SHA: ${{ needs.quality-gate.outputs.source-sha }}
            DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
            DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
            DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
            DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        steps:
            - name: Refuse a stale main deployment
              shell: bash
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  set -euo pipefail
                  current_sha="$(curl --fail --silent --show-error \
                      --header "Authorization: Bearer $GITHUB_TOKEN" \
                      --header "Accept: application/vnd.github+json" \
                      --header "X-GitHub-Api-Version: 2022-11-28" \
                      "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/heads/main" | jq -r '.object.sha')"
                  test "$current_sha" = "$SOURCE_SHA" || {
                      echo "Refusing stale deployment: expected $SOURCE_SHA, current $current_sha" >&2
                      exit 75
                  }
            - name: Deploy immutable image through the server allowlist
              shell: bash
              run: |
                  set -euo pipefail
                  install -m 700 -d "$HOME/.ssh"
                  printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
                  printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
                  chmod 600 "$HOME/.ssh/known_hosts" "$HOME/.ssh/id_ed25519"
                  ssh -i "$HOME/.ssh/id_ed25519" \
                      -o BatchMode=yes \
                      -o IdentitiesOnly=yes \
                      -o StrictHostKeyChecking=yes \
                      "$DEPLOY_USER@$DEPLOY_HOST" \
                      "sudo /usr/local/sbin/meal-deploy admin '$ADMIN_IMAGE' '$SOURCE_SHA'"
